spring:
  application:
    name: subtitle-studio
  datasource:
    # Derived from data-dir so one setting (env SUBTITLESTUDIO_DATADIR) moves both the DB and the .vtt files.
    url: jdbc:h2:file:${subtitle-studio.data-dir}/subtitle-studio;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

subtitle-studio:
  ytdlp:
    path: yt-dlp
    timeout: 60s
  data-dir: ./data
