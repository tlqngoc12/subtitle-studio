spring:
  application:
    name: subtitle-studio
  datasource:
    # Default: H2 dev database next to the .vtt files (env SUBTITLESTUDIO_DATADIR moves both).
    # MODE=Oracle lets H2 run the same Oracle SQL migrations as the real database (profile "oracle").
    url: jdbc:h2:file:${subtitle-studio.data-dir}/dev;MODE=Oracle;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    # Integer column types for db/migration; profile "oracle" overrides them with NUMBER(19) / NUMBER(10).
    placeholders:
      bigint: BIGINT
      int: INTEGER
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

subtitle-studio:
  ytdlp:
    path: yt-dlp
    timeout: 60s
  data-dir: ./data
  gemini:
    # Empty = translation off. Set GEMINI_API_KEY in .env; never commit or log it.
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash
    timeout: 3m
    max-duration: 60m
    temperature: 0.3
