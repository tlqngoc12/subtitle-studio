spring:
  application:
    name: subtitle-studio
  datasource:
    # Default: H2 dev database next to the .vtt files (env SUBTITLESTUDIO_DATADIR moves both).
    # MODE=Oracle lets H2 run the same Oracle SQL migrations as the real database (profile "oracle").
    url: jdbc:h2:file:${subtitle-studio.data-dir}/dev;MODE=Oracle;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    # Integer column types for db/migration; profile "oracle" overrides them with NUMBER(19) / NUMBER(10).
    placeholders:
      bigint: BIGINT
      int: INTEGER
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
    contentnegotiation:
      # Neither Tomcat nor Spring knows .webmanifest: without this the home-screen manifest is application/octet-stream.
      media-types:
        webmanifest: application/manifest+json
  servlet:
    multipart:
      # 10 MB per file (profile images, chapter screenshots); VietsubService still limits .srt files to 5 MB.
      # A request may carry many chapter screenshots at once.
      max-file-size: 10MB
      max-request-size: 300MB

subtitle-studio:
  ytdlp:
    path: yt-dlp
    timeout: 60s
  data-dir: ./data
  # Extra host names allowed to reach the admin (comma-separated), e.g. a Tailscale machine.tailnet.ts.net; never a wildcard.
  allowed-hosts: ${SUBTITLESTUDIO_ALLOWED_HOSTS:}
  gemini:
    # Empty = translation off. Set GEMINI_API_KEY in .env; never commit or log it.
    api-key: ${GEMINI_API_KEY:}
    # gemini-3.8-flash was answering HTTP 503 ("high demand") on the free tier even for tiny requests.
    model: gemini-3.6-flash
    # Tried in order when the model above is overloaded (503), resting after a 503 or out of free quota (429: the
    # free tier allows about 20 requests per day per model). The same model is never retried.
    # gemini-3.5-flash was removed on 2026-11-17: it shares gemini-3.6-flash's free quota (its 429 names
    # gemini-3.6-flash) and is overloaded at the same moments, so it is not a real fallback.
    # gemini-3.1-flash-lite may share gemini-3.5-flash-lite's free quota (unverified; remove it if its 429 names
    # gemini-3.5-flash-lite, like gemini-3.5-flash did). gemini-3.8-flash is last because it often answers 503 on
    # the free tier.
    fallback-models:
      - gemini-3.5-flash-lite
      - gemini-3.1-flash-lite
      - gemini-3.8-flash
    timeout: 3m
    # Longer videos are not translated automatically.
    max-duration: 180m
    # Videos up to this long go in one request; longer ones are split at cue boundaries into parts this long.
    part-duration: 45m
    # Parts are also capped at 400 cues (TranslationParts.MAX_LINES_PER_PART): lite models stop early on long lists.
    temperature: 0.3
    # Thinking level for TRANSLATION requests only (not profile analysis): minimal | low | medium | high.
    # Lower = fewer output tokens, faster, less risk of hitting the output limit or the timeout.
    # Blank = send nothing (the model's own default, which is to think).
    thinking-level: low
    # After a 503 ("overloaded") the model is not asked again for this long: on the free tier a 503 still uses one of
    # the 20 daily requests, and overloads after the 15:00 (Vietnam time) reset can last hours. 0 = off.
    overload-cooldown: 10m
  # Backups run by the app (Settings > Backups): a Data Pump dump of the database plus a zip of ./data, written to
  # ./data/backups. Daily schedule as a Spring cron (seconds first) in Asia/Ho_Chi_Minh; blank = no daily run.
  backup:
    cron: "0 0 12 * * *"
  # Public read-only site on Cloudflare Pages (Publish button). Empty token, account id or project = off.
  publish:
    cloudflare-api-token: ${CLOUDFLARE_API_TOKEN:}
    cloudflare-account-id: ${CLOUDFLARE_ACCOUNT_ID:}
    project: ${SUBTITLESTUDIO_PUBLISH_PROJECT:}
    # D1 database id for novel read counts (Pages Functions are generated at Publish). Blank = read counts off.
    cloudflare-d1-database-id: ${CLOUDFLARE_D1_DATABASE_ID:}
    # false = noindex (meta, X-Robots-Tag, robots.txt): search engines leave the site out.
    indexable: ${SUBTITLESTUDIO_PUBLISH_INDEXABLE:false}
    # Root of public URLs (canonical, sitemap). Blank = https://{project}.pages.dev.
    site-url: ${SUBTITLESTUDIO_PUBLISH_SITE_URL:}
    # Google Search Console HTML-tag verification code (blank = no tag).
    google-verification: ${SUBTITLESTUDIO_PUBLISH_GOOGLE_VERIFICATION:}
    # Cloudflare R2 holds the chapter images so each deploy does not upload them again. All 3 blank = images stay in the Pages bundle.
    r2-bucket: ${SUBTITLESTUDIO_PUBLISH_R2_BUCKET:}
    r2-access-key-id: ${SUBTITLESTUDIO_PUBLISH_R2_ACCESS_KEY_ID:}
    r2-secret-access-key: ${SUBTITLESTUDIO_PUBLISH_R2_SECRET_ACCESS_KEY:}
    wrangler-path: ${SUBTITLESTUDIO_PUBLISH_WRANGLER_PATH:wrangler}
    timeout: 5m
  # Novels translated from page screenshots (Novels menu).
  novel:
    # Screenshots sent to Gemini per request; longer chapters go in several requests.
    pages-per-request: 20
    max-page-image-size: 10MB
    # How chapters are drawn as images for the public site (px).
    render:
      font-size: 44
    # Watermark on public chapter images; empty = the public site's host (<project>.pages.dev).
    watermark-text: ${SUBTITLESTUDIO_NOVEL_WATERMARK:}
    # Wattpad chapters: an original text longer than this (characters) is split at a scene break or paragraph before
    # it goes to Gemini; a shorter one is translated in a single request.
    max-source-chars: 60000
    # Media resolution of page screenshots sent to Gemini: low | medium | high. Lower uses fewer image tokens per
    # page but reads small or dense Thai text less accurately; high is the most accurate.
    media-resolution: high

# Log to the console (docker compose logs) and to a file that survives container rebuilds:
# {data-dir}/logs/app.log, i.e. ./data/logs on the host. Rolled daily and at 10 MB (app.log.YYYY-MM-DD.N.gz),
# kept 14 days and at most 200 MB in total. Override with LOGGING_FILE_NAME (empty = no file).
logging:
  file:
    name: ${subtitle-studio.data-dir}/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
