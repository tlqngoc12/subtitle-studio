spring:
  application:
    name: subtitle-studio
  datasource:
    # Default: H2 dev database next to the .vtt files (env SUBTITLESTUDIO_DATADIR moves both).
    # MODE=Oracle lets H2 run the same Oracle SQL migrations as the real database (profile "oracle").
    url: jdbc:h2:file:${subtitle-studio.data-dir}/dev;MODE=Oracle;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks that the entities match it.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
  flyway:
    # Integer column types for db/migration; profile "oracle" overrides them with NUMBER(19) / NUMBER(10).
    placeholders:
      bigint: BIGINT
      int: INTEGER
  h2:
    console:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # 10 MB for profile images; VietsubService still limits .srt files to 5 MB.
      max-file-size: 10MB
      max-request-size: 10MB

subtitle-studio:
  ytdlp:
    path: yt-dlp
    timeout: 60s
  data-dir: ./data
  gemini:
    # Empty = translation off. Set GEMINI_API_KEY in .env; never commit or log it.
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash
    timeout: 3m
    max-duration: 60m
    temperature: 0.3

# Log to the console (docker compose logs) and to a file that survives container rebuilds:
# {data-dir}/logs/app.log, i.e. ./data/logs on the host. Rolled daily and at 10 MB (app.log.YYYY-MM-DD.N.gz),
# kept 14 days and at most 200 MB in total. Override with LOGGING_FILE_NAME (empty = no file).
logging:
  file:
    name: ${subtitle-studio.data-dir}/logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 200MB
