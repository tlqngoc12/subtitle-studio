services:
  subtitle-studio:
    build: .
    image: subtitle-studio:local
    ports:
      - "8080:8080"
    volumes:
      # Same ./data folder as `java -jar`, so both ways of running share one DB and subs/.
      # Do not run both at once. On Linux the folder must be writable by uid 10001
      # (e.g. `sudo chown -R 10001 data`).
      - ./data:/data
    restart: unless-stopped
